<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ededde" />
    <!--
      Everything this app loads is its own: the fonts are bundled, the Lottie files are bundled,
      and there is no network call in the renderer now that the database is local. The policy says
      so, which is what stops an injected script from reaching out.

      'unsafe-inline' is allowed for styles only, because the interface is drawn with inline
      styles by design. connect-src leaves room for the Vite dev server's reload socket in
      development; the packaged app talks to nothing.

      frame-ancestors is deliberately absent: browsers ignore it in a meta tag, and the app cannot
      be framed anyway because the window runs with sandbox and context isolation on.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:5173 http://localhost:5173; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Leads Scraper — Dashboard</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>

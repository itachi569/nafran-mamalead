name: Build installers

on:
  workflow_dispatch:
    inputs:
      unsigned_mac_test:
        description: Build an unsigned Mac installer for private testing
        type: boolean
        default: false
      unsigned_windows_test:
        description: Build an unsigned Windows installer for private testing
        type: boolean
        default: false
      windows_only:
        description: Build only the signed Windows release (use a v* tag)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.unsigned_windows_test || !inputs.unsigned_mac_test }}
    environment: windows-release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      REQUIRE_CODE_SIGNING: '0'
      REQUIRE_UPDATE_FEED: ${{ inputs.unsigned_windows_test && '0' || '1' }}
      LEADSNAP_UPDATE_URL: ${{ vars.WINDOWS_UPDATE_URL || secrets.LEADSNAP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build unsigned Windows test installer
        if: ${{ inputs.unsigned_windows_test }}
        run: npm run package:win -- --publish never
      - name: Check Artifact Signing configuration
        if: ${{ !inputs.unsigned_windows_test }}
        env:
          REQUIRE_CODE_SIGNING: '1'
          WINDOWS_SIGNING_METHOD: artifact-signing
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: npm run release:signing:check
      - name: Build unpacked Windows app
        if: ${{ !inputs.unsigned_windows_test }}
        run: npm run package:win:dir
      - name: Sign in to Azure with GitHub OIDC
        if: ${{ !inputs.unsigned_windows_test }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application binaries with Azure Artifact Signing
        if: ${{ !inputs.unsigned_windows_test }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\release\win-unpacked
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build installer from signed application
        if: ${{ !inputs.unsigned_windows_test }}
        run: npm run package:win:from-dir
      - name: Locate Windows installer
        if: ${{ !inputs.unsigned_windows_test }}
        id: windows-installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File -Filter 'MamaLead Setup *.exe')
          if ($files.Count -ne 1) { throw "Expected one MamaLead installer, found $($files.Count)." }
          "path=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign Windows installer with Azure Artifact Signing
        if: ${{ !inputs.unsigned_windows_test }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.windows-installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Refresh signed update metadata
        if: ${{ !inputs.unsigned_windows_test }}
        run: npm run package:win:refresh-update
      - name: Verify Artifact Signing signatures
        if: ${{ !inputs.unsigned_windows_test }}
        shell: pwsh
        run: |
          $targets = @()
          $targets += (Resolve-Path 'release\win-unpacked\MamaLead.exe').Path
          $targets += '${{ steps.windows-installer.outputs.path }}'
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on ${target}: $($signature.StatusMessage)" }
            if ($signature.SignerCertificate.Subject -notmatch '(^|, )CN=Nafran LTD(,|$)') { throw "Unexpected publisher on ${target}" }
            Write-Host "VALID $target — $($signature.SignerCertificate.Subject)"
          }
      - name: Save signed installers as draft release assets
        if: ${{ !inputs.unsigned_windows_test }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw 'Signed releases require a version tag.' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace a published release.' }
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "Windows x64 installer signed by Nafran LTD. Includes update metadata and blockmap. Server publication is performed after artifact verification." | Set-Content "$env:RUNNER_TEMP/release-notes.txt"
            gh release create $tag --verify-tag --draft --title "MamaLead $version for Windows" --notes-file "$env:RUNNER_TEMP/release-notes.txt"
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -like 'MamaLead Setup *.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' })
          if ($files.Count -ne 3) { throw 'Expected installer, blockmap, and latest.yml.' }
          gh release upload $tag @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Signed release asset upload failed.' }
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.unsigned_windows_test }}
        with:
          name: nafran-windows-installer
          retention-days: 7
          path: |
            release/MamaLead Setup *.exe
            release/*.blockmap
            release/latest.yml

  macos:
    if: ${{ !inputs.unsigned_windows_test && !inputs.windows_only && !endsWith(github.ref, '-windows') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      REQUIRE_CODE_SIGNING: ${{ inputs.unsigned_mac_test && '0' || '1' }}
      REQUIRE_NOTARIZATION: ${{ inputs.unsigned_mac_test && '0' || '1' }}
      REQUIRE_UPDATE_FEED: ${{ inputs.unsigned_mac_test && '0' || '1' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.unsigned_mac_test && 'false' || 'true' }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      LEADSNAP_UPDATE_URL: ${{ secrets.LEADSNAP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then exit 0; fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - if: ${{ !inputs.unsigned_mac_test }}
        run: npm run release:signing:check
      - name: Build Mac installer
        shell: bash
        run: |
          if [ "${{ inputs.unsigned_mac_test }}" = "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          npm run package:mac -- --${{ matrix.arch }} --publish never
      - name: Test installed Mac app and bundled Chromium
        run: node scripts/verify-packaged-mac.mjs
      - name: Test Mac trial and licence activation
        run: node scripts/verify-desktop-trial.mjs
      - if: ${{ inputs.unsigned_mac_test }}
        uses: actions/upload-artifact@v4
        with:
          name: nafran-macos-${{ matrix.arch }}-test-dmg
          path: release/*.dmg
      - if: ${{ !inputs.unsigned_mac_test }}
        uses: actions/upload-artifact@v4
        with:
          name: nafran-macos-${{ matrix.arch }}-installer
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  linux:
    if: ${{ !inputs.unsigned_mac_test && !inputs.unsigned_windows_test && !inputs.windows_only && !endsWith(github.ref, '-windows') }}
    runs-on: ubuntu-latest
    env:
      REQUIRE_LINUX_SIGNING: '1'
      REQUIRE_UPDATE_FEED: '1'
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
      LEADSNAP_UPDATE_URL: ${{ secrets.LEADSNAP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:signing:check
      - run: npm run package:linux
      - name: Import Linux signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Sign Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          pass_args=()
          if [ -n "${LINUX_GPG_PASSPHRASE:-}" ]; then
            pass_args+=(--pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE")
          fi
          shopt -s nullglob
          artifacts=(release/*.AppImage release/*.deb)
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes "${pass_args[@]}" --local-user "$LINUX_GPG_KEY_ID" --armor --detach-sign "$artifact"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nafran-linux-installer
          path: release/*
